<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apontamento por OP</title>
<link rel="stylesheet" href="estilo.css">
<script>
// Mostra qualquer erro de JavaScript na tela (ajuda a achar problemas no config.js)
window.onerror = function(m){
  function mostrar(){ var d = document.getElementById("erroGlobal") || document.body.insertAdjacentElement("afterbegin", Object.assign(document.createElement("div"), {id:"erroGlobal"}));
    d.textContent = "Erro na página: " + m + " (confira o config.js)"; }
  if(document.body) mostrar(); else document.addEventListener("DOMContentLoaded", mostrar);
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<header><h1 id="titulo">Apontamento</h1><small id="subtitulo">carregando...</small></header>
<main>
  <!-- TELA A: máquina com OP em andamento -->
  <div id="telaAberta" class="oculto">
    <div class="card aberto">
      <h2>🟢 OP em andamento</h2>
      <div id="abertaTexto" style="font-size:18px;line-height:1.5"></div>
    </div>
    <div class="card">
      <h2>Encerrar lote</h2>
      <label for="qtdProduzida">Quantidade produzida</label>
      <input id="qtdProduzida" type="number" min="0" inputmode="numeric">
      <!-- Só aparece se a quantidade for MENOR que a da OP -->
      <div id="divergencia" class="oculto">
        <div class="msg erro" id="avisoDivergencia" style="margin-top:12px"></div>
        <label for="motivoDiv">Motivo da divergência</label>
        <select id="motivoDiv">
          <option value="">– selecione –</option>
          <option>Material faltando</option><option>Falha na usinagem</option><option>Outros</option>
        </select>
        <div id="outrosBox" class="oculto">
          <label for="outrosTexto">Descreva o motivo</label>
          <input id="outrosTexto" placeholder="Ex.: ferramenta quebrou">
        </div>
      </div>
      <button id="btnEncerrar" class="btn-verde">✔ ENCERRAR LOTE</button>
    </div>
    <div class="card">
      <h2>Interromper (a OP pode ser retomada depois)</h2>
      <select id="motivo">
        <option>Pausa para outra peça</option><option>Fim de turno</option><option>Manutenção</option>
        <option>Falta de material</option><option>Setup</option><option>Outro</option>
      </select>
      <button id="btnInterromper" class="btn-vermelho">⏸ INTERROMPER</button>
    </div>
  </div>

  <!-- TELA B: máquina livre -->
  <div id="telaLivre" class="card oculto">
    <h2>⚪ Máquina livre</h2>
    <label for="operador">Operador</label>
    <select id="operador"></select>
    <label>Escolha a OP</label>
    <div id="listaOps"></div>
    <button id="btnIniciar" class="btn-azul">▶ INICIAR</button>
  </div>

  <div id="msg"></div>
  <div class="card"><h2>Outras máquinas</h2><div id="outras"></div></div>
</main>

<script>
// =====================================================================
// 1) Conexão e máquina do QR Code  (index.html?m=CNC1)
// =====================================================================
const db = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const maquina = new URLSearchParams(location.search).get("m");
const $ = id => document.getElementById(id);
let opsDisponiveis = [];
let qtdLote = 0;          // quantidade da OP em andamento nesta máquina

function lembrar(k, v){ try{ localStorage.setItem(k, v) }catch(e){} }
function lembrado(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function mensagem(t, tipo){ $("msg").innerHTML = t ? `<div class="msg ${tipo}">${t}</div>` : ""; }
const hora = ts => new Date(ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const minutos = ts => Math.round((Date.now() - new Date(ts)) / 60000);
const texto = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// =====================================================================
// 2) Ao abrir
// =====================================================================
async function iniciarTela(){
  if(!maquina){ mensagem("QR Code inválido (falta ?m=CODIGO).","erro"); $("subtitulo").textContent=""; return; }
  const { data: maq, error } = await db.from("maquinas").select("nome").eq("codigo", maquina).eq("ativa", true).maybeSingle();
  if(error){ mensagem("Erro de conexão: " + error.message, "erro"); return; }
  if(!maq){ mensagem(`Máquina "${maquina}" não cadastrada.`,"erro"); return; }
  $("titulo").textContent = maq.nome;
  $("subtitulo").textContent = "Código " + maquina;

  // Lista fixa de operadores ativos (cadastrados pelo PCP)
  const { data: ops } = await db.from("operadores").select("nome").eq("ativo", true).order("nome");
  $("operador").innerHTML = `<option value="">– selecione –</option>` +
    (ops || []).map(o => `<option>${texto(o.nome)}</option>`).join("");
  if((ops || []).some(o => o.nome === lembrado("operador"))) $("operador").value = lembrado("operador");

  await atualizar();
}

// =====================================================================
// 3) Decide a tela: esta máquina tem OP em andamento?
// =====================================================================
async function atualizar(){
  const { data: abertos, error } = await db.rpc("apontamentos_abertos");
  if(error){ mensagem("Erro: " + error.message, "erro"); return; }
  const minha  = abertos.find(a => a.maquina_codigo === maquina);
  const outras = abertos.filter(a => a.maquina_codigo !== maquina);

  if(minha){
    $("abertaTexto").innerHTML =
      `OP <b>${texto(minha.op)}</b> · Peça <b>${texto(minha.peca)}</b><br>${minha.descricao ? texto(minha.descricao) + "<br>" : ""}Lote: ${minha.quantidade} peças<br>Operador: ${texto(minha.operador)}<br>Desde ${hora(minha.inicio)} · há ${minutos(minha.inicio)} min`;
    qtdLote = minha.quantidade;
    $("qtdProduzida").value = minha.quantidade;          // já vem com a quantidade da OP
    $("motivoDiv").value = ""; $("outrosTexto").value = "";
    verificarDivergencia();
    $("telaAberta").classList.remove("oculto"); $("telaLivre").classList.add("oculto");
  } else {
    await carregarOps();
    $("telaAberta").classList.add("oculto"); $("telaLivre").classList.remove("oculto");
  }

  $("outras").innerHTML = outras.length
    ? outras.map(a => `🟢 <b>${texto(a.maquina)}</b>: OP ${texto(a.op)} – ${texto(a.peca)} (${texto(a.operador)}, há ${minutos(a.inicio)} min)`).join("<br>")
    : "Nenhuma outra máquina em operação.";
}

// Lista as OPs na ORDEM DO PCP.
// 1º bloco: fila desta máquina (sem máquina definida ou definida para esta) -> a 1ª é a SUGERIDA
// 2º bloco: OPs planejadas para outra máquina (o operador vê e pode escolher, se precisar otimizar)
let sugerida = null;
async function carregarOps(){
  const { data, error } = await db.rpc("ops_disponiveis");
  if(error){ mensagem("Erro: " + error.message, "erro"); return; }
  opsDisponiveis = data;
  if(!data.length){
    $("listaOps").innerHTML = "<p>Nenhuma OP disponível. Fale com o PCP.</p>";
    $("btnIniciar").disabled = true; sugerida = null; return;
  }
  $("btnIniciar").disabled = false;

  const daMaquina = data.filter(o => !o.maquina_preferida_codigo || o.maquina_preferida_codigo === maquina);
  const deOutras  = data.filter(o =>  o.maquina_preferida_codigo && o.maquina_preferida_codigo !== maquina);
  sugerida = daMaquina[0] || null;
  const marcada = (sugerida || deOutras[0]).id;

  const item = (o, pos) => `
    <label class="op-item"><input type="radio" name="op" value="${o.id}" ${o.id === marcada ? "checked" : ""}>
      <b>${pos}º · OP ${texto(o.op)}</b> · ${texto(o.peca)} · ${o.quantidade} pç
      ${o.descricao ? `<br><small style="color:#475467">${texto(o.descricao)}</small>` : ""}
      ${o === sugerida ? `<br><span class="tag t-Em">★ Sugerida pelo PCP</span>` : ""}
      ${o.maquina_preferida ? ` <span class="tag t-Aguardando">${texto(o.maquina_preferida)}</span>` : ""}
      ${o.situacao === "Interrompida" ? ` <span class="tag t-Interrompida">⏸ retomar (${Math.round(o.minutos_total)} min feitos)</span>` : ""}
    </label>`;

  $("listaOps").innerHTML =
    (daMaquina.length ? daMaquina.map((o, i) => item(o, i + 1)).join("") : "<p><i>Nenhuma OP na fila desta máquina.</i></p>") +
    (deOutras.length ? `<h2 style="margin:18px 0 0;font-size:14px;color:#475467">Planejadas para outra máquina</h2>` +
                       deOutras.map((o, i) => item(o, i + 1)).join("") : "");
  atualizarBotao();
  document.querySelectorAll('input[name="op"]').forEach(r => r.onchange = atualizarBotao);
}

// O botão diz INICIAR ou RETOMAR conforme a OP escolhida
function atualizarBotao(){
  const id = Number(document.querySelector('input[name="op"]:checked')?.value);
  const op = opsDisponiveis.find(o => o.id === id);
  $("btnIniciar").textContent = op && op.situacao === "Interrompida" ? "▶ RETOMAR" : "▶ INICIAR";
}

// =====================================================================
// 4) Botões
// =====================================================================
async function executar(botao, chamada, textoOk){
  botao.disabled = true;
  const { error } = await chamada();
  mensagem(error ? "Erro: " + error.message : textoOk, error ? "erro" : "ok");
  await atualizar();
  botao.disabled = false;
}

$("btnIniciar").onclick = () => {
  const operador = $("operador").value.trim();
  const opId = Number(document.querySelector('input[name="op"]:checked')?.value);
  if(!operador){ mensagem("Selecione o operador.", "erro"); return; }
  if(!opId){ mensagem("Escolha uma OP.", "erro"); return; }
  // Escolheu fora da sequência? Pede confirmação (mas deixa, para otimizar quando preciso)
  if(sugerida && opId !== sugerida.id){
    const escolhida = opsDisponiveis.find(o => o.id === opId);
    if(!confirm(`A OP sugerida é a ${sugerida.op}. Iniciar a OP ${escolhida.op} fora da sequência?`)) return;
  }
  lembrar("operador", operador);
  executar($("btnIniciar"),
    () => db.rpc("iniciar_apontamento", { p_maquina: maquina, p_operador: operador, p_op: opId }),
    `▶ OP iniciada às ${hora(new Date())}.`);
};

// Se produziu MENOS que a OP, mostra o campo de motivo
function verificarDivergencia(){
  const qtd = Number($("qtdProduzida").value);
  const menor = $("qtdProduzida").value !== "" && qtd < qtdLote;
  $("divergencia").classList.toggle("oculto", !menor);
  $("avisoDivergencia").textContent = `Faltam ${qtdLote - qtd} peças (${qtd} de ${qtdLote}). Informe o motivo.`;
  $("outrosBox").classList.toggle("oculto", $("motivoDiv").value !== "Outros");
}
$("qtdProduzida").oninput = verificarDivergencia;
$("motivoDiv").onchange = verificarDivergencia;

$("btnEncerrar").onclick = () => {
  const qtd = Number($("qtdProduzida").value);
  if($("qtdProduzida").value === "" || qtd < 0){ mensagem("Informe a quantidade produzida.", "erro"); return; }

  let motivo = null;
  if(qtd < qtdLote){
    motivo = $("motivoDiv").value;
    if(!motivo){ mensagem("Selecione o motivo da divergência.", "erro"); return; }
    if(motivo === "Outros"){
      const desc = $("outrosTexto").value.trim();
      if(!desc){ mensagem("Descreva o motivo em 'Outros'.", "erro"); return; }
      motivo = "Outros: " + desc;
    }
  }
  if(!confirm(`Encerrar o lote com ${qtd} de ${qtdLote} peças? A OP será concluída.`)) return;
  executar($("btnEncerrar"),
    () => db.rpc("encerrar_lote", { p_maquina: maquina, p_quantidade: qtd, p_motivo: motivo }),
    `✔ Lote encerrado com ${qtd} peças.`);
};

$("btnInterromper").onclick = () => {
  if(!confirm("Interromper a OP? Ela poderá ser retomada depois.")) return;
  executar($("btnInterromper"),
    () => db.rpc("interromper_apontamento", { p_maquina: maquina, p_motivo: $("motivo").value }),
    "⏸ OP interrompida. Para continuar, leia o QR e escolha RETOMAR.");
};

iniciarTela();
</script>
</body>
</html>
